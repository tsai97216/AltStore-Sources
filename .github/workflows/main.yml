name: Auto Update Chi Source

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-update-chi-source
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Validate Python
        run: python -m py_compile update_source.py validate_source.py

      - name: Run script
        run: python update_source.py

      - name: Validate JSON
        run: python -m json.tool apps.json > /dev/null

      - name: Validate AltStore Source
        run: python validate_source.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "auto: sync Chi Source"
          file_pattern: apps.json README.md
